{% extends 'base.html' %}
{% load static %}
{% block title %}登录AT{% endblock %}
{% block MainText %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

            <div class="card shadow">
                <div class="card-header text-center">
                    <h5 class="mb-0">AT 账号登录</h5>
                </div>

                <div class="card-body">
                    <form action="/login/" method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="inputAccount" class="form-label">账号</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                <input type="text" id="inputAccount" name="Account" class="form-control"
                                    placeholder="账号" minlength="6" maxlength="12" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">密码</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" id="password" name="password" class="form-control"
                                    placeholder="请输入密码" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">登录</button>
                        </div>

                        <div class="text-center mt-3">
                            <a href="/register/" class="text-decoration-none me-2">注册用户</a>
                            <span class="text-muted">|</span>
                            <a href="/home" class="text-decoration-none ms-2">进入首页</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% if login %}
<div class="modal fade show d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">提示</h5>
                <a href="/login/" class="btn-close"></a>
            </div>
            <div class="modal-body text-center">
                {{ login.Txt }}
            </div>
            <div class="modal-footer">
                <a href="/home" class="btn btn-outline-primary btn-sm" style="display: {{ login.HomePpage }};">进入首页</a>
                <a href="/register/" class="btn btn-outline-success btn-sm"
                    style="display: {{ login.SignUp }};">注册账号</a>
                <a href="/login/" class="btn btn-primary btn-sm" style="display: {{ login.REENTRY }};">重新登录</a>
            </div>
        </div>
    </div>
</div>
{% endif %}


{% endblock %}
